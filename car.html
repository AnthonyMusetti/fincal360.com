<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Loan Calculator — FinLit360</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
.layout{display:grid;grid-template-columns:360px 1fr;gap:1.25rem;align-items:start}
@media(max-width:1050px){.layout{grid-template-columns:1fr}}
.controls{position:sticky;top:5rem;display:flex;flex-direction:column;gap:1rem}
.right{display:flex;flex-direction:column;gap:1.25rem}
/* Mode tabs */
.mode-bar{display:flex;border:1px solid var(--bdr);border-radius:8px;overflow:hidden;margin-bottom:1rem}
.mode-btn{flex:1;padding:0.55rem;font-family:'DM Mono',monospace;font-size:0.72rem;text-align:center;cursor:pointer;background:var(--surf2);color:var(--mut2);border:none;transition:all 0.15s;border-right:1px solid var(--bdr)}
.mode-btn:last-child{border-right:none}
.mode-btn.active{background:rgba(74,222,128,0.1);color:var(--grn)}
/* View toggle for amort table */
.view-bar{display:flex;gap:0.4rem;margin-bottom:0.85rem}
.view-btn{padding:0.35rem 0.85rem;font-family:'DM Mono',monospace;font-size:0.68rem;background:var(--surf2);border:1px solid var(--bdr);border-radius:5px;color:var(--mut2);cursor:pointer;transition:all 0.15s}
.view-btn.active{background:rgba(74,222,128,0.1);border-color:rgba(74,222,128,0.4);color:var(--grn)}
/* Summary rows */
.srow{display:flex;justify-content:space-between;align-items:baseline;padding:0.42rem 0;border-bottom:1px solid var(--bdr)}
.srow:last-child{border-bottom:none}
.srow-lbl{font-size:0.78rem;font-family:'DM Mono',monospace;color:var(--mut2)}
.srow-val{font-size:0.85rem;font-weight:600;font-family:'DM Mono',monospace}
/* Hero result */
.hero-result{background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.2);border-radius:12px;padding:1.25rem 1.5rem;display:flex;align-items:baseline;gap:0.75rem;flex-wrap:wrap}
.hero-label{font-size:0.78rem;font-family:'DM Mono',monospace;color:var(--mut2)}
.hero-value{font-size:2.2rem;font-weight:700;letter-spacing:-0.03em;color:var(--grn)}
/* Checkbox row */
.check-row{display:flex;align-items:center;gap:0.6rem;margin-top:0.35rem}
.check-row input[type=checkbox]{width:14px;height:14px;accent-color:var(--grn);cursor:pointer}
.check-row label{font-size:0.72rem;font-family:'DM Mono',monospace;color:var(--mut2);cursor:pointer}

@media(max-width:768px){
  .layout{grid-template-columns:1fr !important}
}
</style>

<script>
// ============================================================
// MATH ENGINE
// Verified exact against reference screenshot:
// $40k / 5% / 60mo = $754.85, total $45,290.96, interest $5,290.96
// Upfront = $16,425.00, total cost = $61,715.96
// Year 1: interest $1,835.98, principal $7,222.21, balance $32,777.79
// ============================================================

function calcPayment(principal, annualRate, months) {
  if (principal <= 0) return 0;
  if (annualRate === 0) return months > 0 ? principal / months : 0;
  const r = annualRate / 100 / 12;
  return principal * (r * Math.pow(1+r, months)) / (Math.pow(1+r, months) - 1);
}

function calcMaxLoan(payment, annualRate, months) {
  if (payment <= 0 || months <= 0) return 0;
  if (annualRate === 0) return payment * months;
  const r = annualRate / 100 / 12;
  return payment * (Math.pow(1+r, months) - 1) / (r * Math.pow(1+r, months));
}

function buildAmort(principal, annualRate, months) {
  if (principal <= 0 || months <= 0) return { payment:0, rows:[] };
  const r       = annualRate / 100 / 12;
  const payment = calcPayment(principal, annualRate, months);
  let   balance = principal;
  const rows    = [];
  for (let m = 0; m < months && balance > 0.005; m++) {
    const interest = balance * r;
    let   prin     = payment - interest;
    if (prin > balance) prin = balance;
    balance = Math.max(0, balance - prin);
    rows.push({ month: m+1, payment: interest+prin, principal: prin, interest, balance });
    if (balance < 0.005) break;
  }
  return { payment, rows };
}

// ── STATE ─────────────────────────────────────────────────
let mode     = 'total';   // 'total' | 'monthly'
let viewMode = 'annual';  // 'annual' | 'monthly'
let donutChart = null;
let amortChart = null;

// ── MODE / VIEW TOGGLES ───────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('mode-total').style.display   = m==='total'   ? 'block':'none';
  document.getElementById('mode-monthly').style.display = m==='monthly' ? 'block':'none';
  document.getElementById('btn-total').classList.toggle('active',   m==='total');
  document.getElementById('btn-monthly').classList.toggle('active', m==='monthly');
  render();
}

function setView(v) {
  viewMode = v;
  document.getElementById('vb-annual').classList.toggle('active',  v==='annual');
  document.getElementById('vb-monthly').classList.toggle('active', v==='monthly');
  document.getElementById('period-th').textContent = v==='annual' ? 'Year' : 'Month';
  render();
}

// ── RATE SLIDER SYNC ──────────────────────────────────────
function onTRateInput()  { document.getElementById('t-rate-slider').value = document.getElementById('t-rate').value; render(); }
function onTRateSlider() { document.getElementById('t-rate').value = document.getElementById('t-rate-slider').value; render(); }
function onMRateInput()  { document.getElementById('m-rate-slider').value = document.getElementById('m-rate').value; render(); }
function onMRateSlider() { document.getElementById('m-rate').value = document.getElementById('m-rate-slider').value; render(); }

function getV(id) { return parseFloat(document.getElementById(id).value) || 0; }

// ── MAIN RENDER ───────────────────────────────────────────
function render() {
  let loanAmt, monthlyPay, saleTax, upfront, vehiclePrice, term, rate, rollTaxes, fees;

  if (mode === 'total') {
    const price      = getV('t-price');
    term             = getV('t-term') || 60;
    rate             = getV('t-rate');
    const incentives = getV('t-incentives');
    const down       = getV('t-down');
    const tradeIn    = getV('t-tradein');
    const tradeOwed  = getV('t-tradeowed');
    const taxRate    = getV('t-tax');
    fees             = getV('t-fees');
    rollTaxes        = document.getElementById('t-rolltax').checked;
    vehiclePrice     = price;

    saleTax = price * taxRate / 100;
    const netTrade = tradeIn - tradeOwed;

    // Loan = price - down - incentives - positive trade equity + negative trade equity
    let baseLoan = price - down - incentives - Math.max(0, netTrade) + Math.max(0, -netTrade);
    if (rollTaxes) baseLoan += saleTax + fees;
    loanAmt = Math.max(0, baseLoan);

    const { payment, rows } = buildAmort(loanAmt, rate, term);
    monthlyPay = payment;

    upfront = rollTaxes ? (down + Math.max(0, netTrade)) : (down + Math.max(0, netTrade) + saleTax + fees);

    document.getElementById('hero-label').textContent = 'Monthly Pay:';
    document.getElementById('hero-value').textContent = fL2(monthlyPay);
    document.getElementById('hero-sub').textContent   = `${term} payments of ${fL2(monthlyPay)}`;

    const totalPaid     = monthlyPay * rows.length;
    const totalInterest = rows.reduce((s,r)=>s+r.interest, 0);

    updateCards(loanAmt, saleTax, upfront, totalInterest);
    updateBreakdown(loanAmt, totalPaid, totalInterest, saleTax, fees, price, term);
    updateDonut(loanAmt, totalInterest);
    updateAmortTable(rows);

    // Update net worth
    updateNetWorth({ car_balances_total: loanAmt });

  } else {
    // Monthly payment mode — solve for max affordable vehicle price
    const targetPay = getV('m-payment');
    term            = getV('m-term') || 60;
    rate            = getV('m-rate');
    const down      = getV('m-down');
    const tradeIn   = getV('m-tradein');
    const tradeOwed = getV('m-tradeowed');
    const taxRate   = getV('m-tax');
    fees            = getV('m-fees');
    rollTaxes       = document.getElementById('m-rolltax').checked;

    loanAmt      = calcMaxLoan(targetPay, rate, term);
    monthlyPay   = targetPay;
    const netTrade = tradeIn - tradeOwed;
    // Vehicle price = loan + down + net trade equity (simplified: assumes no taxes in loan)
    vehiclePrice = loanAmt + down + Math.max(0, netTrade);
    saleTax      = vehiclePrice * taxRate / 100;
    upfront      = rollTaxes ? (down + Math.max(0, netTrade)) : (down + Math.max(0, netTrade) + saleTax + fees);

    const { rows } = buildAmort(loanAmt, rate, term);
    const totalInterest = rows.reduce((s,r)=>s+r.interest, 0);
    const totalPaid     = monthlyPay * rows.length;

    document.getElementById('hero-label').textContent = 'Max Vehicle Price:';
    document.getElementById('hero-value').textContent = fL2(vehiclePrice);
    document.getElementById('hero-sub').textContent   = `with ${fL2(targetPay)}/mo · ${term} months`;

    updateCards(loanAmt, saleTax, upfront, totalInterest);
    updateBreakdown(loanAmt, totalPaid, totalInterest, saleTax, fees, vehiclePrice, term);
    updateDonut(loanAmt, totalInterest);
    updateAmortTable(rows);

    updateNetWorth({ car_balances_total: loanAmt });
  }
}

function updateCards(loanAmt, saleTax, upfront, totalInterest) {
  document.getElementById('st-loan').textContent     = fL2(loanAmt);
  document.getElementById('st-tax').textContent      = fL2(saleTax);
  document.getElementById('st-upfront').textContent  = fL2(upfront);
  document.getElementById('st-interest').textContent = fL2(totalInterest);
}

function updateBreakdown(loanAmt, totalPaid, totalInterest, saleTax, fees, price, term) {
  document.getElementById('breakdown').innerHTML = `
    <div class="srow"><span class="srow-lbl">Total Loan Amount</span><span class="srow-val">${fL2(loanAmt)}</span></div>
    <div class="srow"><span class="srow-lbl">Sale Tax</span><span class="srow-val">${fL2(saleTax)}</span></div>
    <div class="srow"><span class="srow-lbl">Fees</span><span class="srow-val">${fL2(fees)}</span></div>
    <div class="srow"><span class="srow-lbl">Total of ${term} Loan Payments</span><span class="srow-val">${fL2(totalPaid)}</span></div>
    <div class="srow"><span class="srow-lbl">Total Loan Interest</span><span class="srow-val" style="color:var(--red)">${fL2(totalInterest)}</span></div>
    <div class="srow" style="border-bottom:none;padding-top:0.5rem"><span class="srow-lbl" style="color:var(--txt);font-weight:600">Total Cost (price+int+tax+fees)</span><span class="srow-val" style="font-size:1rem;color:var(--grn)">${fL2(price + totalInterest + saleTax + fees)}</span></div>
  `;
}

function updateDonut(loanAmt, totalInterest) {
  const data   = [loanAmt, totalInterest];
  const labels = ['Principal','Interest'];
  const colors = ['#60a5fa','#4ade80'];
  const total  = loanAmt + totalInterest;
  if (donutChart) {
    donutChart.data.datasets[0].data = data;
    donutChart.update('none');
  } else {
    donutChart = new Chart(document.getElementById('donut-chart'), {
      type: 'doughnut',
      data: { labels, datasets:[{ data, backgroundColor:colors, borderWidth:0, hoverOffset:4 }] },
      options: {
        responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins: {
          legend: { display:false },
          tooltip: { callbacks:{ label: ctx=>`  ${ctx.label}: ${fL2(ctx.raw)} (${total>0?(ctx.raw/total*100).toFixed(0):0}%)` } }
        }
      }
    });
  }
  document.getElementById('donut-legend').innerHTML = labels.map((l,i)=>`
    <span style="display:flex;align-items:center;gap:4px">
      <span style="width:8px;height:8px;border-radius:2px;background:${colors[i]};display:inline-block"></span>${l}
    </span>`).join('');
}

function updateAmortTable(rows) {
  // Build annual summary
  const yearMap = {};
  rows.forEach(r => {
    const yr = Math.ceil(r.month / 12);
    if (!yearMap[yr]) yearMap[yr] = { interest:0, principal:0, balance:0 };
    yearMap[yr].interest  += r.interest;
    yearMap[yr].principal += r.principal;
    yearMap[yr].balance    = r.balance;
  });

  // Chart data
  let chartLabels, chartBal, chartInt, chartPrin;
  if (viewMode === 'annual') {
    const yrs   = Object.keys(yearMap);
    chartLabels = yrs.map(y=>'Yr '+y);
    chartBal    = yrs.map(y=>Math.round(yearMap[y].balance));
    chartInt    = yrs.map(y=>Math.round(yearMap[y].interest));
    chartPrin   = yrs.map(y=>Math.round(yearMap[y].principal));
  } else {
    chartLabels = rows.map(r=>r.month);
    chartBal    = rows.map(r=>Math.round(r.balance));
    chartInt    = rows.map(r=>r.interest);
    chartPrin   = rows.map(r=>r.principal);
  }

  if (amortChart) {
    amortChart.data.labels = chartLabels;
    amortChart.data.datasets[0].data = chartBal;
    amortChart.data.datasets[1].data = chartInt;
    amortChart.data.datasets[2].data = chartPrin;
    amortChart.update('none');
  } else {
    amortChart = new Chart(document.getElementById('amort-chart'), {
      type: 'line',
      data: {
        labels: chartLabels,
        datasets: [
          { label:'Balance',   data:chartBal,  borderColor:'#60a5fa', backgroundColor:'rgba(96,165,250,0.07)', fill:true, tension:0.3, pointRadius:2 },
          { label:'Interest',  data:chartInt,  borderColor:'#4ade80', fill:false, tension:0.3, pointRadius:0 },
          { label:'Principal', data:chartPrin, borderColor:'#ef4444', fill:false, tension:0.3, pointRadius:0 },
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false, animation:{duration:150},
        plugins: {
          legend: { labels:{ color:'#9ca3af', font:{family:'DM Mono',size:10}, boxWidth:10, padding:12 } },
          tooltip: { callbacks:{ label: ctx=>`  ${ctx.dataset.label}: ${fL2(ctx.raw)}` } }
        },
        scales: {
          x: { ticks:{ color:'#6b7280', font:{family:'DM Mono',size:9}, maxTicksLimit:10 }, grid:{ color:'rgba(255,255,255,0.04)' } },
          y: { ticks:{ callback:v=>fS(v), color:'#9ca3af', font:{family:'DM Mono',size:10} }, grid:{ color:'rgba(255,255,255,0.05)' } }
        }
      }
    });
  }

  // Table
  const tbody = document.getElementById('amort-tbody');
  tbody.innerHTML = '';
  if (viewMode === 'annual') {
    Object.keys(yearMap).forEach(yr => {
      const yd = yearMap[yr];
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>Year ${yr}</td>
        <td style="color:#f87171">${fL2(yd.interest)}</td>
        <td style="color:#4ade80">${fL2(yd.principal)}</td>
        <td>${fL2(yd.balance)}</td>
      `;
      tbody.appendChild(tr);
    });
  } else {
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>Month ${r.month}</td>
        <td style="color:#f87171">${fL2(r.interest)}</td>
        <td style="color:#4ade80">${fL2(r.principal)}</td>
        <td>${fL2(r.balance)}</td>
      `;
      tbody.appendChild(tr);
    });
  }
}

// ── SAVE / LOAD ───────────────────────────────────────────
const TIDS = ['t-price','t-term','t-rate','t-incentives','t-down','t-tradein','t-tradeowed','t-tax','t-fees'];
const MIDS = ['m-payment','m-term','m-rate','m-down','m-tradein','m-tradeowed','m-tax','m-fees'];

function doSave() {
  const state = { _mode: mode, _view: viewMode };
  [...TIDS,...MIDS].forEach(id => { const el=document.getElementById(id); if(el) state[id]=el.value; });
  ['t-rolltax','m-rolltax'].forEach(id => { const el=document.getElementById(id); if(el) state[id]=el.checked; });
  storeSave(KEYS.car, state);
  showSaveConfirm();
}

function loadSaved() {
  const s = storeLoad(KEYS.car);
  if (!s) return;
  if (s._mode) setMode(s._mode);
  if (s._view) setView(s._view);
  [...TIDS,...MIDS].forEach(id => { const el=document.getElementById(id); if(el&&s[id]!==undefined) el.value=s[id]; });
  ['t-rolltax','m-rolltax'].forEach(id => { const el=document.getElementById(id); if(el&&s[id]!==undefined) el.checked=s[id]; });
  // Sync sliders
  document.getElementById('t-rate-slider').value = document.getElementById('t-rate').value;
  document.getElementById('m-rate-slider').value = document.getElementById('m-rate').value;
}
